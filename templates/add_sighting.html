<!DOCTYPE html>
<!-- author: Camille Thoms -->
<!-- The following function was generated with help from claude sonnet for table structure and temporary flash message-->
<html>
<head><title>Log a Sighting</title></head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p><strong>{{ message }}</strong></p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h1>Log a Sighting</h1>
    <a href="/sightings">Back to Sightings</a>
    <br><br>

    <form method="POST">
        <label>Display Name:</label><br>
        <input type="text" name="display_name" required><br><br>
        <label>Animal Tag:</label><br>
        <input type="text" name="animal_tag" placeholder="e.g. emu, cow" required><br><br>
        <label>What did you see?</label><br>
        <textarea name="sighting" rows="3" cols="40" required></textarea><br><br>
        <button type="submit">Submit Sighting</button>
    </form>
</body>
</html>
