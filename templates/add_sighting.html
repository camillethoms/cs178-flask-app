<!-- AI assistance used for form structure -->
<!DOCTYPE html>
<html>
<head>
    <title>Log a Sighting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f8f1; }
        .navbar { background-color: #3d6b45; }
        .navbar-brand, .nav-link { color: #ffffff !important; }
        .nav-link:hover { color: #c8e6c9 !important; }
        h1 { color: #3d6b45; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Alveus Sanctuary!</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/animals">Animals</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sightings">Sighting Log</a></li>
                    <li class="nav-item"><a class="nav-link" href="/trending"> Trending</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1 class="mb-4">Log a Sighting</h1>
        <div class="card p-4" style="max-width: 600px; background-color: #ffffff;">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Display Name</label>
                    <input type="text" name="display_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Animal Tag</label>
                    <input type="text" name="animal_tag" class="form-control" placeholder="e.g. emu, cow, serval" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">What did you see or learn?</label>
                    <textarea name="sighting" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Submit Sighting</button>
                <a href="/sightings" class="btn btn-outline-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
